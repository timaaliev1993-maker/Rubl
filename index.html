<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СберКликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #1a4f2e;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        /* Карта */
        .card {
            background: #1e8f4a;
            border-radius: 20px;
            padding: 20px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .bank-name {
            font-size: 24px;
            font-weight: bold;
        }
        .chip {
            width: 50px;
            height: 35px;
            background: #cdb38c;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .card-number {
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-family: monospace;
        }
        .balance {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        /* Монета */
        .coin {
            width: 200px;
            height: 200px;
            background: #ffd700;
            border-radius: 50%;
            margin: 20px auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 #b8860b;
            border: 4px solid #ffed8a;
            transition: all 0.1s;
        }
        .coin:active {
            transform: scale(0.95);
            box-shadow: 0 4px 0 #b8860b;
        }
        .coin-value {
            font-size: 48px;
            font-weight: bold;
            color: #8b6911;
        }
        .coin-year {
            font-size: 16px;
            color: #8b6911;
        }
        /* Летающая цифра */
        .float-number {
            position: fixed;
            color: #ffd700;
            font-size: 40px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: float 1s ease-out forwards;
        }
        @keyframes float {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-150px); }
        }
        /* Статистика */
        .stats {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            color: white;
            margin-top: 20px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Карта -->
        <div class="card">
            <div class="card-header">
                <span class="bank-name">СБЕРБАНК</span>
                <span>МИР</span>
            </div>
            <div class="chip"></div>
            <div class="card-number">2200 1234 5678 9012</div>
            <div class="balance" id="balance">0 ₽</div>
            <div class="card-footer">
                <span id="cardHolder">RUB CLICKER</span>
                <span id="cardExpiry">12/26</span>
            </div>
        </div>

        <!-- Монета -->
        <div class="coin" id="coin">
            <div class="coin-value">1 ₽</div>
            <div class="coin-year" id="year">2026</div>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalClicks">0</div>
                <div class="stat-label">Всего кликов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="sessionClicks">0</div>
                <div class="stat-label">За сессию</div>
            </div>
        </div>
    </div>

    <script>
        // Простая проверка Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        // Переменные
        let balance = 0;
        let totalClicks = 0;
        let sessionClicks = 0;

        // Элементы
        const balanceEl = document.getElementById('balance');
        const totalClicksEl = document.getElementById('totalClicks');
        const sessionClicksEl = document.getElementById('sessionClicks');
        const coin = document.getElementById('coin');
        const yearEl = document.getElementById('year');

        // Устанавливаем текущий год
        yearEl.textContent = new Date().getFullYear();

        // Загружаем сохраненные данные
        const saved = localStorage.getItem('sber');
        if (saved) {
            const data = JSON.parse(saved);
            balance = data.balance || 0;
            totalClicks = data.totalClicks || 0;
        }

        // Обновление экрана
        function updateDisplay() {
            balanceEl.textContent = balance + ' ₽';
            totalClicksEl.textContent = totalClicks;
            sessionClicksEl.textContent = sessionClicks;
            
            // Сохраняем
            localStorage.setItem('sber', JSON.stringify({
                balance: balance,
                totalClicks: totalClicks
            }));
        }

        // Создание летающей цифры
        function createFloatNumber(x, y) {
            const div = document.createElement('div');
            div.className = 'float-number';
            div.textContent = '+1 ₽';
            div.style.left = (x - 30) + 'px';
            div.style.top = y + 'px';
            document.body.appendChild(div);
            
            setTimeout(function() {
                div.remove();
            }, 1000);
        }

        // Обработка клика
        coin.onclick = function(e) {
            const rect = coin.getBoundingClientRect();
            const x = rect.left + rect.width/2;
            const y = rect.top;
            
            createFloatNumber(x, y);
            
            balance++;
            totalClicks++;
            sessionClicks++;
            
            updateDisplay();
        };

        // Показываем при загрузке
        updateDisplay();
    </script>
</body>
</html>
